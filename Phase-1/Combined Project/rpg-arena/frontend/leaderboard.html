<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RPG Arena — Leaderboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <a href="arena.html">Arena</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="index.html" id="logoutLink">Log out</a>
  </nav>

  <h1>Leaderboard</h1>

  <div class="card">
    <h2>Top Players</h2>
    <table id="leaderboardTable">
      <thead>
        <tr>
          <th>Username</th>
          <th>Wins</th>
          <th>Losses</th>
          <th>Total Damage</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Class Stats</h2>
    <table id="classStatsTable">
      <thead>
        <tr>
          <th>Class</th>
          <th>Matches</th>
          <th>Wins</th>
          <th>Avg Damage</th>
          <th>Best Damage</th>
        </tr>
      </thead>
      <tbody id="classStatsBody"></tbody>
    </table>
  </div>

  <script src="js/leaderboard.js"></script>
</body>
</html>
