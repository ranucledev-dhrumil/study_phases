[package]
name = "second-brain"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "second-brain"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "second_brain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
arboard = "3"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
tauri-plugin-dialog = "2"
rand = "0.10.3"
regex = "1.13.1"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
tauri-plugin-notification = "2.5.0"




# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
