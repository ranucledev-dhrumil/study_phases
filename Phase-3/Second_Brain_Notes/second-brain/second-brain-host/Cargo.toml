[package]
name = "second-brain-host"
version = "0.1.0"
edition = "2021"
description = "Chrome/Edge Native Messaging Host companion binary for Second Brain"
authors = ["you"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }
